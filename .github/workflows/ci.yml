name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # CPU-only PyTorch; tests use synthetic faces/landmarks, no dataset, model download or GPU.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy opencv-python-headless onnxruntime pillow pyyaml tqdm matplotlib \
            scikit-learn pyarrow pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
